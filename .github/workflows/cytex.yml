              languages: [python]
              severity: ERROR
              message: >-
                A model or artifact obtained from a remote hub, URL or user input is deserialized with a pickle-based
                loader. Pickle runs code on load. Use safetensors / weights_only loading and verify artifact hashes.
              metadata:
                category: ai-security
                cwe: ["CWE-502: Deserialization of Untrusted Data"]
                owasp-llm: ["LLM03:2025 Supply Chain", "LLM04:2025 Data and Model Poisoning"]
                confidence: HIGH
                likelihood: MEDIUM
                impact: HIGH
              mode: taint
              pattern-sources:
