                        import { $CLS } from "$PKG"
                        ...
                    - pattern-inside: |
                        $CLS = require("$PKG")
                        ...
                - metavariable-regex:
                    metavariable: $PKG
                    regex: ^(openai|@anthropic-ai/sdk|groq-sdk|@mistralai/mistralai|cohere-ai|@google/genai|@google/generative-ai|ollama|@huggingface/inference|@langchain/[\w-]+|@ai-sdk/[\w-]+)$
                - pattern-either:
                    - pattern: 'new $CLS({..., $KW: "$KEY", ...})'
                    - pattern: '$CLS({..., $KW: "$KEY", ...})'
                - metavariable-regex:
                    metavariable: $KW
                    regex: ^(apiKey|\w+ApiKey|token|accessToken|api_key)$
                - metavariable-regex:
                    metavariable: $KEY
                    regex: ^(?!(?i:.*(your|xxx|placeholder|changeme|change-me|dummy|example|fake|redacted|replace|insert|test-key|sk-\.\.\.|<|>|\$\{|\{\{|\*{3}))).{16,}$
                - metavariable-regex:
