            - id: cytex-ai.js.llm-output-to-dangerous-sink
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                LLM output flows into eval/Function, a shell command, raw SQL, or raw HTML (innerHTML /
                dangerouslySetInnerHTML). A prompt-injected model can run code or inject script. Treat model output
                as untrusted: sanitize HTML (DOMPurify), parameterize queries, never execute generated code unsandboxed.
              metadata:
                category: ai-security
                cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-79: Cross-site Scripting", "CWE-78: OS Command Injection"]
                owasp-llm: ["LLM05:2025 Improper Output Handling"]
                confidence: HIGH
                likelihood: MEDIUM
                impact: HIGH
              mode: taint
              pattern-sources:
                - pattern-either:
                    - pattern: $C.chat.completions.create(...)
                    - pattern: $C.responses.create(...)
                    - pattern: '$C.messages.create({..., messages: $M, ...})'
                    - pattern: $C.generateContent(...)
                    - pattern: $C.models.generateContent(...)
                    - pattern: $LLM.invoke(...)
                    - patterns:
                        - pattern-inside: |
                            import { $FN } from "ai"
                            ...
                        - pattern: $FN(...)
                        - metavariable-regex:
                            metavariable: $FN
                            regex: ^(generateText|generateObject)$
              pattern-sanitizers:
                - pattern-either:
                    - pattern: DOMPurify.sanitize(...)
                    - pattern: $X.sanitize(...)
                    - pattern: escapeHtml(...)
                    - pattern: parseInt(...)
                    - pattern: Number(...)
              pattern-sinks:
                - patterns:
                    - pattern-either:
                        - pattern: eval($SINK)
                        - pattern: new Function(..., $SINK)
                        - pattern: Function(..., $SINK)
                        - pattern: $EL.innerHTML = $SINK
                        - pattern: $EL.outerHTML = $SINK
                        - pattern: $EL.insertAdjacentHTML($POS, $SINK)
