                - pattern-either:
                    - pattern: shlex.quote(...)
                    - pattern: html.escape(...)
                    - pattern: markupsafe.escape(...)
                    - pattern: bleach.clean(...)
                    - pattern: int(...)
                    - pattern: float(...)
              pattern-sinks:
                - patterns:
                    - pattern-either:
                        - pattern: eval($SINK, ...)
                        - pattern: exec($SINK, ...)
                        - pattern: compile($SINK, ...)
                        - pattern: os.system($SINK)
                        - pattern: os.popen($SINK, ...)
                        - pattern: subprocess.$FN($SINK, ...)
                        - pattern: subprocess.$FN(..., args=$SINK, ...)
                        - pattern: asyncio.create_subprocess_shell($SINK, ...)
                        - pattern: asyncio.create_subprocess_exec($SINK, ...)
                        - pattern: $CUR.execute($SINK, ...)
                        - pattern: $CUR.executemany($SINK, ...)
                        - pattern: $CUR.executescript($SINK, ...)
                        - pattern: sqlalchemy.text($SINK)
                        - pattern: flask.render_template_string($SINK, ...)
                        - pattern: markupsafe.Markup($SINK)
                        - pattern: jinja2.Template($SINK, ...)
