                    - focus-metavariable: $SINK

            # =====================================================================================
            # Risk: hardcoded AI API keys (LLM02)
            # =====================================================================================
            - id: cytex-ai.py.hardcoded-ai-api-key
              languages: [python]
              severity: ERROR
              message: >-
                Hardcoded credential passed as `$KW` to AI client `$CLIENT`. Anyone with repository access can use and
                bill the key. Load it from a secret manager or environment variable and rotate the exposed key.
              metadata:
                category: ai-security
                cwe: ["CWE-798: Use of Hard-coded Credentials"]
                owasp-llm: ["LLM02:2025 Sensitive Information Disclosure"]
                confidence: HIGH
                likelihood: HIGH
                impact: HIGH
                secret: true
              patterns:
                - pattern-either:
                    - pattern: openai.$X(...)
                    - pattern: anthropic.$X(...)
                    - pattern: groq.$X(...)
                    - pattern: mistralai.$X(...)
                    - pattern: cohere.$X(...)
                    - pattern: google.genai.Client(...)
                    - pattern: google.generativeai.configure(...)
                    - pattern: ollama.$X(...)
                    - pattern: litellm.$X(...)
                    - pattern: huggingface_hub.$X(...)
                    - pattern: langchain_openai.$X(...)
                    - pattern: langchain_anthropic.$X(...)
                    - pattern: langchain_groq.$X(...)
                    - pattern: langchain_google_genai.$X(...)
                    - pattern: langchain_mistralai.$X(...)
                    - pattern: langchain_cohere.$X(...)
                    - pattern: langchain_nvidia_ai_endpoints.$X(...)
                    - pattern: langchain_community.chat_models.$X(...)
                    - pattern: langchain_community.llms.$X(...)
                    - pattern: langchain.chat_models.$X(...)
                    - pattern: boto3.client("=~/^bedrock/", ...)
                    - pattern: boto3.client(..., service_name="=~/^bedrock/", ...)
                - pattern: $CLIENT(..., $KW="$KEY", ...)
                # callee name check keeps $CLIENT on the matched call, not a call nested in its arguments
                - metavariable-regex:
                    metavariable: $CLIENT
                    regex: ^(?:[\w.]+\.)?(?:\w+|Client|configure|client)$
                - metavariable-regex:
                    metavariable: $KW
                    regex: ^(api_key|\w+_api_key|token|api_token|huggingfacehub_api_token|hf_token|aws_secret_access_key|azure_ad_token)$
                # Real-looking secret: 16+ chars, no whitespace, not a placeholder. Never echoed in the message.
                - metavariable-regex:
                    metavariable: $KEY
                    regex: ^(?!(?i:.*(your|xxx|placeholder|changeme|change-me|dummy|example|fake|redacted|replace|insert|test-key|sk-\.\.\.|<|>|\$\{|\{\{|\*{3}))).{16,}$
                - metavariable-regex:
                    metavariable: $KEY
                    regex: ^\S+$

            - id: cytex-ai.js.hardcoded-ai-api-key
