            # =====================================================================================
            # Risk: supply chain / model deserialization (LLM03, LLM04)
            # =====================================================================================
            - id: cytex-ai.py.trust-remote-code
              languages: [python]
              severity: WARNING
              message: >-
                `trust_remote_code=True` executes Python shipped inside the model repository at load time. A compromised
                or typosquatted model runs arbitrary code. Pin a reviewed revision (`revision="<sha>"`) or avoid remote code.
              metadata:
                category: ai-security
                cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"]
                owasp-llm: ["LLM03:2025 Supply Chain"]
                confidence: HIGH
                likelihood: MEDIUM
                impact: HIGH
              patterns:
                - pattern: $F(..., trust_remote_code=True, ...)
                - pattern-not: $F(..., trust_remote_code=True, ..., revision="...", ...)
                - pattern-not: $F(..., revision="...", ..., trust_remote_code=True, ...)

            - id: cytex-ai.py.torch-load-unsafe
              languages: [python]
              severity: WARNING
              message: >-
                `torch.load` without `weights_only=True` unpickles arbitrary objects. A malicious checkpoint runs code
                on load. Pass `weights_only=True` or use safetensors.
              metadata:
                category: ai-security
                cwe: ["CWE-502: Deserialization of Untrusted Data"]
                owasp-llm: ["LLM03:2025 Supply Chain", "LLM04:2025 Data and Model Poisoning"]
                confidence: MEDIUM
                likelihood: LOW
                impact: HIGH
              patterns:
                - pattern: torch.load(...)
                - pattern-not: torch.load(..., weights_only=True, ...)

