          cat > /tmp/cytex-tools/trufflehog_aibom.py <<'CYTEX_TRUFFLEHOG_AIBOM_PY_EOF'
          """Merge TruffleHog (detection only, --no-verification) JSONL findings into the CycloneDX report.

          A finding on a file+line that gitleaks already reported is folded into that gitleaks component
          as `secret:AlsoDetectedBy=trufflehog:<Detector>`; other findings become new `data` components
          shaped like the gitleaks ones.

          Never copies Raw / RawV2 / Redacted / ExtraData / StructuredData or anything else that can hold
          the secret. When `scan_root` is given, the finding's source line is read only to pull out the
          assigned variable name (the text before `=` / `:`); the value is never kept.
          """
          import hashlib
          import json
          import os
          import re

          # (pattern searched in detector name / variable name, provider, ai_related)
          # Note: TruffleHog's `Gemini` detector is the Gemini crypto exchange; Google's is `GoogleGeminiAPIKey`.
          _PROVIDERS = [
              (r"openrouter", "OpenRouter", True),
              (r"azure ?openai|aoai", "Azure OpenAI", True),
              (r"openai", "OpenAI", True),
              (r"anthropic|claude", "Anthropic", True),
              (r"groq", "Groq", True),
              (r"nvidia|nvapi|\bnim\b", "NVIDIA", True),
              (r"hugging|\bhf_|^hf$", "HuggingFace", True),
              (r"gemini|google_ai|genai|palm", "Google Gemini", True),
              (r"vertex", "Google Vertex AI", True),
              (r"cohere", "Cohere", True),
              (r"mistral", "Mistral", True),
              (r"perplexity|pplx", "Perplexity", True),
              (r"replicate", "Replicate", True),
              (r"together", "Together AI", True),
              (r"deepseek", "DeepSeek", True),
              (r"fireworks", "Fireworks AI", True),
              (r"^xai$|\bxai\b|grok", "xAI", True),
              (r"ollama", "Ollama", True),
              (r"langsmith|langchain", "LangSmith", True),
              (r"langfuse", "Langfuse", True),
              (r"braintrust|brain ?trust", "Braintrust", True),
              (r"pinecone", "Pinecone", True),
              (r"weaviate", "Weaviate", True),
              (r"qdrant", "Qdrant", True),
              (r"tavily", "Tavily", True),
              (r"elevenlabs|eleven_labs", "ElevenLabs", True),
              (r"stability", "Stability AI", True),
              (r"voyage", "Voyage AI", True),
              (r"assemblyai|assembly ?ai", "AssemblyAI", True),
              (r"deepgram", "Deepgram", True),
              (r"clarifai", "Clarifai", True),
              (r"edenai|eden ?ai", "Eden AI", True),
              (r"deepai|deep ?ai\b", "DeepAI", True),
              (r"azure ?ml|azuremlwebservice", "Azure ML", True),
              (r"\bwandb\b|weights ?and ?biases|weightsandbiases", "Weights & Biases", True),
              (r"\bllm\b", "LLM (unspecified)", True),
              # non-AI, still useful to label
              (r"github", "GitHub", False),
              (r"gitlab", "GitLab", False),
              (r"\baws\b|amazon", "AWS", False),
              (r"\bgcp\b|google ?api ?key|googleoauth|google ?oauth", "Google Cloud", False),
              (r"azure", "Azure", False),
              (r"slack", "Slack", False),
              (r"stripe", "Stripe", False),
              (r"\bnvd\b", "NIST NVD", False),
              (r"\botx\b|alienvault", "AlienVault OTX", False),
              (r"wasabi", "Wasabi", False),
              (r"mongo", "MongoDB", False),
              (r"postgres|\bpg\b", "PostgreSQL", False),
              (r"privatekey|private ?key", "Private Key", False),
              (r"jdbc|\buri\b", "Connection String", False),
          ]
          _PROVIDERS = [(re.compile(p, re.I), name, ai) for p, name, ai in _PROVIDERS]

          # Detector names that the substring table would misclassify.
          _EXACT = {"Gemini": ("Gemini (crypto exchange)", False)}

          # Variable name at the start of a source line, e.g. `export OPENAI_API_KEY="..."` -> OPENAI_API_KEY.
          _VAR_RE = re.compile(r"""^[\s#/*;-]*(?:export\s+)?["']?([A-Za-z_][A-Za-z0-9_.-]{1,80}?)["']?\s*(?::=|=|:)""")
          _MAX_READ = 8 * 1024 * 1024  # never read more than this many bytes of a file to find a line


          def _split_words(text):
              """`GoogleGeminiAPIKey` -> `Google Gemini API Key`, `OPENAI_API_KEY` -> `OPENAI API KEY`."""
              text = re.sub(r"([a-z0-9])([A-Z])", r"\1 \2", text)
              text = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1 \2", text)
              return re.sub(r"[_\-.]+", " ", text)


          def _lookup(text):
              if not text:
                  return None
              norm = _split_words(text)
              for rx, provider, ai in _PROVIDERS:
                  if rx.search(norm) or rx.search(text):
                      return provider, ai
              return None


          def _classify(detector, var_name):
              """Detector decides, unless it is non-AI/unknown and the variable is AI
              (GoogleApiKey on GEMINI_API_KEY -> Google Gemini), mirroring gitleaks_aibom."""
              by_det = _EXACT.get(detector) or _lookup(detector)
              by_var = _lookup(var_name)
              if by_det and by_det[1]:
                  return by_det
              if by_var and by_var[1]:
                  return by_var
              return by_det or by_var or ("unknown", False)


          def _clean_name(name):
              if not name or not re.search(r"[A-Za-z]", name) or re.search(r"[A-Za-z0-9]{40,}", name):
                  return None
              return name


          def _read_line(path, lineno):
              """Return line `lineno` (1-based) of `path`, or None. Bounded read; text only."""
              try:
                  if lineno is None or int(lineno) < 1 or not os.path.isfile(path):
                      return None
                  want = int(lineno)
                  read = 0
                  with open(path, "rb") as fh:
                      for i, raw in enumerate(fh, 1):
                          read += len(raw)
                          if read > _MAX_READ:
                              return None
                          if i == want:
                              return raw[:4096].decode("utf-8", "replace")
              except (OSError, ValueError):
                  return None
              return None


          def _var_name_from_line(text):
              """Only the identifier left of the assignment operator is returned, never the value."""
              if not isinstance(text, str):
                  return None
              m = _VAR_RE.match(text)
              return _clean_name(m.group(1)) if m else None


          def _location(finding):
              """(file, line) from SourceMetadata.Data.<SourceKind>.{file,line}, tolerant of source kinds."""
              data = ((finding.get("SourceMetadata") or {}).get("Data") or {})
              if not isinstance(data, dict):
                  return None, None
              for meta in data.values():
                  if isinstance(meta, dict) and (meta.get("file") or meta.get("path")):
                      line = meta.get("line")
                      try:
                          line = int(line) if line not in (None, "") else None
                      except (TypeError, ValueError):
                          line = None
                      return str(meta.get("file") or meta.get("path")), line
              return None, None


          def _relpath(path, scan_root):
              p = path.replace("\\", "/")
              if scan_root:
                  given = scan_root.replace("\\", "/").rstrip("/") + "/"
                  root = os.path.abspath(scan_root).replace("\\", "/").rstrip("/") + "/"
                  absolute = os.path.abspath(path).replace("\\", "/")
                  if given not in ("./", "/") and p.startswith(given):
                      p = p[len(given):]
                  elif absolute.startswith(root):
                      p = absolute[len(root):]
              while p.startswith("./"):
                  p = p[2:]
              return p


          def _prop(component, name):
              for p in component.get("properties") or []:
                  if isinstance(p, dict) and p.get("name") == name:
                      return p.get("value")
              return None


          def trufflehog_components(jsonl_text, existing_components, scan_root=None, ai_only=False):
              """Return (new_components, stats).

              `jsonl_text`: trufflehog `--json` stdout (one JSON object per line; non-JSON lines ignored).
              `existing_components`: report components; gitleaks/secret components at the same file+line
              get `secret:AlsoDetectedBy=trufflehog:<Detector>` appended IN PLACE instead of a new one.
              `scan_root`: directory that was scanned; makes paths relative and lets the variable name be
              read from the source line. `ai_only`: drop new non-AI components (merges always happen).
              stats: {"added", "merged", "merged_components", "duplicates", "unparsed", "skipped_non_ai",
              "detectors": {detector: count}}.
              """
              stats = {"added": 0, "merged": 0, "merged_components": 0, "duplicates": 0, "unparsed": 0,
                       "skipped_non_ai": 0, "detectors": {}}
              by_loc = {}
              existing_refs = set()
              for comp in existing_components or []:
                  if not isinstance(comp, dict):
                      continue
                  existing_refs.add(comp.get("bom-ref"))
                  if _prop(comp, "cisco-aibom:type") != "secret" or comp.get("_source") == "trufflehog":
                      continue
                  key = (str(_prop(comp, "cisco-aibom:file") or ""), str(_prop(comp, "cisco-aibom:line") or ""))
                  by_loc.setdefault(key, []).append(comp)

              seen = set()
              touched = set()
              new = []
              for raw_line in (jsonl_text or "").splitlines():
                  raw_line = raw_line.strip()
                  if not raw_line.startswith("{"):
                      continue
                  try:
                      f = json.loads(raw_line)
                  except ValueError:
                      stats["unparsed"] += 1
                      continue
                  if not isinstance(f, dict) or not (f.get("DetectorName") or f.get("DetectorType") is not None):
                      continue  # log lines that happen to be JSON
                  detector = str(f.get("DetectorName") or "Detector%s" % f.get("DetectorType"))
                  path, line = _location(f)
                  if not path:
                      stats["unparsed"] += 1
                      continue
                  rel = _relpath(path, scan_root)
                  line_s = "" if line is None else str(line)
                  key = (rel, line_s, detector)
                  if key in seen:
                      stats["duplicates"] += 1
                      continue
                  seen.add(key)
                  stats["detectors"][detector] = stats["detectors"].get(detector, 0) + 1

                  targets = by_loc.get((rel, line_s))
                  if targets:
                      tag = "trufflehog:" + detector
                      for comp in targets:
                          props = comp.setdefault("properties", [])
                          if not any(p.get("name") == "secret:AlsoDetectedBy" and p.get("value") == tag for p in props):
                              props.append({"name": "secret:AlsoDetectedBy", "value": tag})
                          touched.add(id(comp))
                      stats["merged"] += 1
                      continue

                  var = None
                  if scan_root:
                      abs_path = path if os.path.isabs(path) else os.path.join(scan_root, rel)
                      var = _var_name_from_line(_read_line(abs_path, line))
                  provider, ai = _classify(detector, var)
                  if ai_only and not ai:
                      stats["skipped_non_ai"] += 1
                      continue
                  ref = "secret:trufflehog:" + hashlib.sha256(("%s|%s|%s" % (rel, line_s, detector)).encode()).hexdigest()[:16]
                  if ref in existing_refs:
                      stats["duplicates"] += 1
                      continue
                  new.append({
                      "type": "data",
                      "bom-ref": ref,
                      "name": var or detector,
                      "_source": "trufflehog",
                      "properties": [
                          {"name": "cisco-aibom:type", "value": "secret"},
                          {"name": "cisco-aibom:file", "value": rel},
                          {"name": "cisco-aibom:line", "value": line_s},
                          {"name": "secret:RuleID", "value": "trufflehog-" + detector.lower()},
                          {"name": "secret:Detector", "value": detector},
                          {"name": "secret:Provider", "value": provider},
                          {"name": "secret:AIRelated", "value": "true" if ai else "false"},
                      ],
                  })
              stats["added"] = len(new)
              stats["merged_components"] = len(touched)
              return new, stats
          CYTEX_TRUFFLEHOG_AIBOM_PY_EOF
          cat > /tmp/cytex-tools/modelscan_aibom.py <<'CYTEX_MODELSCAN_AIBOM_PY_EOF'
          """Convert a ModelScan (Protect AI) JSON report into CycloneDX components + vulnerabilities.

          One `machine-learning-model` component per model file ModelScan scanned (plus skipped files that
          carry a model extension, `modelscan:Status=skipped`; and files it failed to parse,
          `modelscan:Status=error`), and one vulnerability per issue,
          `affects`-linked to its file's component. Tolerates the report layouts of modelscan 0.5 - 0.8
          (`summary.scanned.scanned_files` may be missing; skipped files may be strings or dicts; issue
          locations may be `source`, `location`, or nested under `details`).
          """
          import hashlib
          import os
          import re

          _MODEL_EXT = {
              ".pkl": "pickle", ".pickle": "pickle", ".joblib": "joblib", ".dill": "pickle",
              ".pt": "pytorch", ".pth": "pytorch", ".ckpt": "pytorch", ".bin": "pytorch",
              ".h5": "keras_h5", ".hdf5": "keras_h5", ".keras": "keras",
              ".pb": "tensorflow_savedmodel", ".npy": "numpy", ".npz": "numpy",
              ".safetensors": "safetensors", ".onnx": "onnx", ".gguf": "gguf",
          }
          _SCANNER_FMT = [
              (r"pytorch", "pytorch"), (r"numpy", "numpy"), (r"pickle", "pickle"),
              (r"savedmodel", "tensorflow_savedmodel"), (r"h5", "keras_h5"), (r"keras", "keras"),
          ]
          _SEVERITIES = {"CRITICAL": "critical", "HIGH": "high", "MEDIUM": "medium", "LOW": "low",
                         "INFO": "info", "NONE": "none"}


          def _norm_path(path, scan_root, input_path=None):
              """Path relative to the scan root, '/' separated, archive members kept (`a.zip:inner.pkl`)."""
              p = str(path).replace("\\", "/")
              for root in (input_path, scan_root):
                  if not root:
                      continue
                  r = str(root).replace("\\", "/").rstrip("/")
                  candidates = {r, os.path.abspath(r).replace("\\", "/")}
                  try:
                      candidates.add(os.path.realpath(r).replace("\\", "/"))
                  except OSError:
                      pass
                  for c in candidates:
                      if c and c not in (".", "/") and p.startswith(c + "/"):
                          p = p[len(c) + 1:]
                          break
              while p.startswith("./"):
                  p = p[2:]
              return p


          def _outer_file(path):
              """`model.zip:archive/data.pkl` -> `model.zip` (the file on disk)."""
              m = re.match(r"^(.*?\.(?:zip|pt|pth|ckpt|bin|npz|keras|tar|gz|7z)):(.+)$", path, re.I)
              return m.group(1) if m else path


          def _fmt(path, scanner=None):
              ext = _MODEL_EXT.get(os.path.splitext(path)[1].lower(), "unknown")
              if scanner:
                  s = str(scanner).lower().rsplit(".", 1)[-1]
                  for pat, fmt in _SCANNER_FMT:
                      if re.search(pat, s):
                          # a pickle scanner on .joblib/.pt/... keeps the more specific extension format
                          return ext if (fmt == "pickle" and ext != "unknown") else fmt
              return ext


          def _is_model(path):
              return os.path.splitext(path)[1].lower() in _MODEL_EXT


          def _ref(rel):
              return "model:modelscan:" + hashlib.sha256(rel.encode()).hexdigest()[:16]


          def _issue_location(issue):
              for key in ("source", "location", "file", "path"):
                  if issue.get(key):
                      return str(issue[key])
              det = issue.get("details") or {}
              if isinstance(det, dict):
                  for key in ("source", "location", "file", "path"):
                      if det.get(key):
                          return str(det[key])
              return ""


          def _issue_field(issue, *keys):
              det = issue.get("details") if isinstance(issue.get("details"), dict) else {}
              for k in keys:
                  for src in (issue, det):
                      v = src.get(k)
                      if v not in (None, ""):
                          return v
              return None


          def modelscan_entries(report_dict, scan_root):
              """Return (components, vulnerabilities, stats).

              `report_dict`: parsed `modelscan -r json` output. `scan_root`: directory passed to `-p`.
              stats: {"modelscan_version", "scanned", "issues", "by_severity", "errors": [...],
              "skipped": [...], "skipped_total"}; errors/skipped entries are {"file", "category", "description"}.
              """
              stats = {"modelscan_version": None, "scanned": 0, "issues": 0, "by_severity": {},
                       "errors": [], "skipped": [], "skipped_total": 0}
              if not isinstance(report_dict, dict):
                  return [], [], stats
              summary = report_dict.get("summary") or {}
              input_path = summary.get("absolute_path") or summary.get("input_path")
              stats["modelscan_version"] = summary.get("modelscan_version")

              files = {}  # rel -> {"format", "status", "scanner"}

              rank = {"scanned": 3, "error": 2, "skipped": 1}

              def add_file(rel, status, scanner=None):
                  rel = _outer_file(rel)
                  if not rel:
                      return
                  cur = files.get(rel)
                  if cur is None:
                      files[rel] = {"format": _fmt(rel, scanner), "status": status}
                      return
                  if rank[status] > rank[cur["status"]]:
                      cur["status"] = status
                  if scanner and cur["format"] == "unknown":
                      cur["format"] = _fmt(rel, scanner)

              scanned = summary.get("scanned") or {}
              scanned_list = scanned.get("scanned_files") if isinstance(scanned, dict) else None
              for item in scanned_list or []:
                  path = item if isinstance(item, str) else (item or {}).get("source") or (item or {}).get("path")
                  if path:
                      add_file(_norm_path(path, scan_root, input_path), "scanned", None if isinstance(item, str) else item.get("scanner"))

              issues = report_dict.get("issues") or []
              if isinstance(issues, dict):  # very old layouts grouped issues by severity
                  issues = [i for v in issues.values() if isinstance(v, list) for i in v]
              for issue in issues:
                  if isinstance(issue, dict) and _issue_location(issue):
                      add_file(_norm_path(_issue_location(issue), scan_root, input_path), "scanned", issue.get("scanner"))

              skipped = summary.get("skipped") or {}
              skipped_list = skipped.get("skipped_files") if isinstance(skipped, dict) else skipped
              for item in skipped_list or []:
                  if isinstance(item, dict):
                      path = item.get("source") or item.get("path") or ""
                      entry = {"file": _norm_path(path, scan_root, input_path) if path else "",
                               "category": str(item.get("category") or ""), "description": str(item.get("description") or "")}
                  else:
                      entry = {"file": _norm_path(item, scan_root, input_path), "category": "", "description": ""}
                  stats["skipped"].append(entry)
                  # A model extension that ModelScan recognised but does not scan (e.g. safetensors) is still a
                  # model file; MAGIC_NUMBER means "not actually this format" (e.g. a random .bin), so leave it out.
                  if (entry["file"] and _is_model(entry["file"]) and ":" not in entry["file"]
                          and entry["category"].upper() != "MAGIC_NUMBER"):
                      add_file(entry["file"], "skipped")
              stats["skipped_total"] = (skipped.get("total_skipped") if isinstance(skipped, dict) else None) or len(stats["skipped"])

              for err in report_dict.get("errors") or []:
                  if isinstance(err, dict):
                      path = err.get("source") or err.get("path") or ""
                      rel = _norm_path(path, scan_root, input_path) if path else ""
                      stats["errors"].append({"file": rel, "category": str(err.get("category") or ""),
                                              "description": str(err.get("description") or err.get("message") or "")})
                      if rel and _is_model(_outer_file(rel)):
                          add_file(rel, "error")  # model file ModelScan could not parse
                  else:
                      stats["errors"].append({"file": "", "category": "", "description": str(err)})

              components = []
              for rel in sorted(files):
                  meta = files[rel]
                  components.append({
                      "type": "machine-learning-model",
                      "bom-ref": _ref(rel),
                      "name": os.path.basename(rel) or rel,
                      "_source": "modelscan",
                      "properties": [
                          {"name": "cisco-aibom:type", "value": "model_file"},
                          {"name": "cisco-aibom:file", "value": rel},
                          {"name": "modelscan:Format", "value": meta["format"]},
                          {"name": "modelscan:Status", "value": meta["status"]},
                      ],
                  })
              stats["scanned"] = sum(1 for m in files.values() if m["status"] == "scanned")

              vulns = []
              seen = set()
              for issue in issues:
                  if not isinstance(issue, dict):
                      continue
                  loc = _norm_path(_issue_location(issue), scan_root, input_path) if _issue_location(issue) else ""
                  outer = _outer_file(loc)
                  operator = _issue_field(issue, "operator")
                  module = _issue_field(issue, "module")
                  code = _issue_field(issue, "code", "id")
                  if operator:
                      vid = "%s.%s" % (module, operator) if module else str(operator)
                  else:
                      vid = str(code or "modelscan-issue")
                  sev_raw = str(_issue_field(issue, "severity") or "").upper().rsplit(".", 1)[-1]
                  sev = _SEVERITIES.get(sev_raw, "unknown")
                  desc = str(_issue_field(issue, "description") or "")
                  key = (outer, loc, vid, sev)
                  if key in seen:
                      continue
                  seen.add(key)
                  stats["by_severity"][sev] = stats["by_severity"].get(sev, 0) + 1
                  props = [{"name": "modelscan:Location", "value": loc}]
                  if module:
                      props.append({"name": "modelscan:Module", "value": str(module)})
                  if operator:
                      props.append({"name": "modelscan:Operator", "value": str(operator)})
                  scanner = _issue_field(issue, "scanner")
                  if scanner:
                      props.append({"name": "modelscan:Scanner", "value": str(scanner)})
                  vulns.append({
                      "bom-ref": "vuln:modelscan:" + hashlib.sha256(("%s|%s|%s" % (loc, vid, sev)).encode()).hexdigest()[:16],
                      "id": vid,
                      "source": {"name": "modelscan"},
                      "ratings": [{"source": {"name": "modelscan"}, "severity": sev, "method": "other"}],
                      "description": desc,
                      "affects": [{"ref": _ref(outer)}] if outer else [],
                      "properties": props,
                      "_source": "modelscan",
                  })
              stats["issues"] = len(vulns)
              return components, vulns, stats
          CYTEX_MODELSCAN_AIBOM_PY_EOF
          cat > /tmp/cytex-tools/extra_scanners.py <<'CYTEX_EXTRA_SCANNERS_PY_EOF'
          """Merge the extra detectors into the consolidated report: Cytex semgrep AI rules
          (components cisco-aibom missed), TruffleHog (secrets, merged into gitleaks findings) and
          ModelScan (model files and their unsafe-serialization issues).

          Each source is optional and isolated: a missing or broken output only skips that source.
          """
          import json
          import os

          from modelscan_aibom import modelscan_entries
          from semgrep_ai import ai_components, dedupe_against, redact_secret_results
          from trufflehog_aibom import trufflehog_components


          def _read(path, as_json=True):
              try:
                  with open(path, encoding="utf-8", errors="replace") as fh:
                      return json.load(fh) if as_json else fh.read()
              except (OSError, ValueError):
                  return None


          DOCUMENT_EXT = (".xlsx", ".xls", ".docx", ".doc", ".pptx", ".pdf", ".zip", ".jar", ".gz", ".tar", ".png", ".jpg")


          def _rate_secrets(components):
              """Unverified secrets get a confidence: two detectors agreeing -> high, one -> medium, one
              detector inside a document/archive (decoded binary content, pattern-only) -> low."""
              for comp in components:
                  if comp.get("_source") not in ("gitleaks", "trufflehog"):
                      continue
                  props = {p.get("name"): p.get("value") for p in comp.get("properties") or []}
                  if "cytex:confidence" in props:
                      continue
                  both = bool(props.get("secret:AlsoDetectedBy"))
                  in_doc = str(props.get("cisco-aibom:file") or "").lower().endswith(DOCUMENT_EXT)
                  level = "high" if both else ("low" if in_doc else "medium")
                  comp.setdefault("properties", []).append({"name": "cytex:confidence", "value": level})


          def merge_extra(combined, report_dir, semgrep_doc, scan_dir):
              """Add semgrep-AI, TruffleHog and ModelScan results to `combined` in place.
              Returns (tool statuses, counts) for cytexScan."""
              status = _read(os.path.join(report_dir, "extra_status.json")) or {}
              counts = {}
              components = combined.setdefault("components", [])
              scan_root = os.path.realpath(scan_dir) if scan_dir else None

              try:
                  if isinstance(semgrep_doc, dict):
                      redact_secret_results(semgrep_doc)
                      found = dedupe_against(ai_components(semgrep_doc, scan_root), components)
                      components.extend(found)
                      counts["semgrepAiComponents"] = len(found)
              except Exception as error:
                  print("semgrep-ai merge skipped: %s: %s" % (type(error).__name__, error))

              try:
                  text = _read(os.path.join(report_dir, "trufflehog.jsonl"), as_json=False)
                  if text:
                      added, stats = trufflehog_components(text, components, scan_root=scan_root)
                      components.extend(added)
                      counts["trufflehogAdded"] = stats.get("added", len(added))
                      counts["trufflehogMerged"] = stats.get("merged", 0)
              except Exception as error:
                  print("trufflehog merge skipped: %s: %s" % (type(error).__name__, error))

              try:
                  report = _read(os.path.join(report_dir, "modelscan.json"))
                  if isinstance(report, dict):
                      models, issues, _ = modelscan_entries(report, status.get("modelscanRoot") or "/tmp/modelscan-src")
                      components.extend(models)
                      combined.setdefault("vulnerabilities", []).extend(issues)
                      counts["modelFiles"] = len(models)
                      counts["modelIssues"] = len(issues)
              except Exception as error:
                  print("modelscan merge skipped: %s: %s" % (type(error).__name__, error))

              _rate_secrets(components)
              tools = {"semgrepAi": "0" if "semgrepAiComponents" in counts else "",
                       "trufflehog": str(status.get("trufflehog", "")), "modelscan": str(status.get("modelscan", ""))}
              return tools, counts
          CYTEX_EXTRA_SCANNERS_PY_EOF
          cat > /tmp/cytex-tools/extra_scans.sh <<'CYTEX_EXTRA_SCANS_SH_EOF'
          # Extra detectors: TruffleHog (secrets, detection only, never verifies against provider APIs)
          # and ModelScan (unsafe serialization in model files; only when model files exist).
          # Never fails the job. Statuses go to $REPORT_DIR/extra_status.json for the report step.
          # usage: bash extra_scans.sh <scan dir> <report dir>
          SRC_DIR=$(cd "$1" && pwd)
          REPORT_DIR=$(mkdir -p "$2" && cd "$2" && pwd)
          TRUFFLEHOG_VERSION=3.99.2
          TRUFFLEHOG_SHA256=3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4
          BIN=/tmp/cytex-bin
          mkdir -p "$BIN"

          # --- TruffleHog: --no-verification --no-update, so it makes no network calls.
          TRUFFLEHOG_STATUS=install_failed
          TH_TGZ=/tmp/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz
          for i in 1 2 3 4 5; do
            curl -sSfL --retry 3 --retry-delay 5 -o "$TH_TGZ" \
              "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" \
              && echo "${TRUFFLEHOG_SHA256}  ${TH_TGZ}" | sha256sum -c - >/dev/null \
              && tar -xzf "$TH_TGZ" -C "$BIN" trufflehog && TRUFFLEHOG_STATUS=installed && break
            echo "trufflehog install failed (attempt $i/5)"; sleep $((i * 15))
          done
          if [ "$TRUFFLEHOG_STATUS" = installed ]; then
            printf '%s\n' '(^|/)\.git/' '(^|/)node_modules/' > /tmp/trufflehog-exclude.txt
            th_rc=0
            ( cd "$SRC_DIR" && timeout 900 "$BIN/trufflehog" filesystem . --no-verification --no-update --json --no-color \
                --exclude-paths=/tmp/trufflehog-exclude.txt > "$REPORT_DIR/trufflehog.jsonl" 2> "$REPORT_DIR/trufflehog.log" ) || th_rc=$?
            case $th_rc in
              0) TRUFFLEHOG_STATUS=0 ;;
              124) TRUFFLEHOG_STATUS=timeout ;;
              *) TRUFFLEHOG_STATUS="error:$th_rc" ;;
            esac
          fi
          echo "trufflehog: $TRUFFLEHOG_STATUS, $(grep -c '^{' "$REPORT_DIR/trufflehog.jsonl" 2>/dev/null || echo 0) finding(s)"

          # --- ModelScan 0.8.8 (numpy 2.2.6: numpy>=2.3 breaks its .npy scanner). Model files are staged
          # (hard links) so .git/node_modules are excluded and repo-relative paths are kept.
          MODELSCAN_STATUS=skipped
          MS_STAGE=/tmp/modelscan-src
          rm -rf "$MS_STAGE" && mkdir -p "$MS_STAGE"
          MS_COUNT=0
          while IFS= read -r -d '' rel; do
            rel="${rel#./}"
            mkdir -p "$MS_STAGE/$(dirname "$rel")"
            ln "$SRC_DIR/$rel" "$MS_STAGE/$rel" 2>/dev/null || cp -p "$SRC_DIR/$rel" "$MS_STAGE/$rel" 2>/dev/null || continue
            MS_COUNT=$((MS_COUNT + 1))
          done < <(cd "$SRC_DIR" && find . \( -name .git -o -name node_modules \) -prune -o -type f \( \
              -iname '*.pkl' -o -iname '*.pickle' -o -iname '*.pt' -o -iname '*.pth' -o -iname '*.bin' \
              -o -iname '*.h5' -o -iname '*.keras' -o -iname '*.pb' -o -iname '*.joblib' -o -iname '*.npy' \
              -o -iname '*.npz' -o -iname '*.safetensors' -o -iname '*.onnx' -o -iname '*.ckpt' \) -print0)
          if [ "$MS_COUNT" -gt 0 ]; then
            if { python3 -m venv /tmp/modelscan-venv \
                 && for i in 1 2 3; do /tmp/modelscan-venv/bin/pip install -q --disable-pip-version-check \
                      "modelscan[h5py]==0.8.8" "numpy==2.2.6" && break; sleep $((i * 10)); false; done; } > "$REPORT_DIR/modelscan-install.log" 2>&1 \
               && /tmp/modelscan-venv/bin/modelscan --version > /dev/null 2>&1; then
              ms_rc=0
              # neutral cwd: modelscan reads ./modelscan-settings.toml, which a repo could plant
              ( cd /tmp && timeout 900 /tmp/modelscan-venv/bin/modelscan -p "$MS_STAGE" -r json --show-skipped \
                  -o "$REPORT_DIR/modelscan.json" > "$REPORT_DIR/modelscan.log" 2>&1 ) || ms_rc=$?
              case $ms_rc in
                0) MODELSCAN_STATUS=0 ;;
                1) MODELSCAN_STATUS=issues ;;
                2) if grep -q '"total_issues": [1-9]' "$REPORT_DIR/modelscan.json" 2>/dev/null; then
                     MODELSCAN_STATUS=issues_with_errors; else MODELSCAN_STATUS=error; fi ;;
                3) MODELSCAN_STATUS=no_supported_files ;;
                124) MODELSCAN_STATUS=timeout ;;
                *) MODELSCAN_STATUS=failed ;;
              esac
            else
              MODELSCAN_STATUS=install_failed
            fi
          fi
          echo "modelscan: $MODELSCAN_STATUS, $MS_COUNT model file(s)"
          printf '{"trufflehog": "%s", "modelscan": "%s", "modelFiles": %d, "modelscanRoot": "%s"}\n' \
            "$TRUFFLEHOG_STATUS" "$MODELSCAN_STATUS" "$MS_COUNT" "$MS_STAGE" > "$REPORT_DIR/extra_status.json"
          true
          CYTEX_EXTRA_SCANS_SH_EOF
      - name: Resolve scan scope
        env:
          CHANGED_FILES: ${{ github.event.inputs.changedFiles }}
        run: |
          mkdir -p "$REPORT_DIR"
          # Our own workflow file is not the customer's code: every scanner flagged it (curl
          # installs, AI pipeline steps). The run has already loaded it, so drop it here.
          rm -f .github/workflows/cytex.yml
          SCAN_TYPE=full
          SCAN_DIR=.
          CHANGED_FILE_COUNT=0
          if [ -n "$CHANGED_FILES" ]; then
            SCAN_TYPE=incremental
            SCAN_DIR=$(mktemp -d)
            IFS=',' read -ra CHANGED <<< "$CHANGED_FILES"
            for path in "${CHANGED[@]}"; do
              if [ -f "$path" ]; then
                mkdir -p "$SCAN_DIR/$(dirname "$path")"
                cp "$path" "$SCAN_DIR/$path"
              fi
            done
            CHANGED_FILE_COUNT=$(find "$SCAN_DIR" -type f | wc -l)
            echo "Incremental scan: $CHANGED_FILE_COUNT of ${#CHANGED[@]} changed path(s) still exist"
          fi
          {
            echo "SCAN_TYPE=$SCAN_TYPE"
            echo "SCAN_DIR=$SCAN_DIR"
            echo "CHANGED_FILE_COUNT=$CHANGED_FILE_COUNT"
          } >> "$GITHUB_ENV"

      # set +e on each scanner so one failure doesn't abort the rest.
      - name: Generate SBOM (Syft)
        run: |
          set +e
          syft "dir:$SCAN_DIR" -o cyclonedx-json > "$REPORT_DIR/sbom.cdx.json"
          echo "SYFT_STATUS=$?" >> "$GITHUB_ENV"

      - name: Scan dependencies for vulnerabilities (Grype)
        run: |
          set +e
          grype "dir:$SCAN_DIR" -o json -o cyclonedx-json="$REPORT_DIR/grype.cdx.json"
          echo "GRYPE_STATUS=$?" >> "$GITHUB_ENV"

      - name: Static analysis (Semgrep)
        run: |
          set +e
          semgrep --config=auto --config "/tmp/cytex-tools/semgrep-ai.yml" "$SCAN_DIR" --json | tee "$REPORT_DIR/semgrep.json"
          echo "SEMGREP_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # Always analyzes the whole checkout: an incremental copy of only the changed files hides
      # the imports, manifests and .env that classification needs. The consolidate step
      # then keeps only components located in the changed files.
      # timeout bounds the enrichment pass; console output (incl. compliance) is teed for the report.
      - name: Generate AIBOM (Cisco AIBOM)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || vars.GROQ_MODEL }}
        run: |
          set +e
          # Whole checkout minus documents/media/archives (cisco-aibom has no exclude option
          # and its secret detector otherwise spends minutes in PDFs); big model weights stay
          # as empty placeholders so they are still detected by name.
          python3 /tmp/cytex-tools/prepare_src.py . "$AIBOM_SRC"
          if [ -z "$GROQ_API_KEY" ] || [ -z "$GROQ_MODEL" ]; then
            # cisco-aibom requires a model name; it points at a dead local address, so the LLM
            # step fails fast and nothing leaves the runner.
            echo "GROQ_API_KEY and GROQ_MODEL not both configured -- rule-based AIBOM only (no LLM)"
            timeout 1200 cisco-aibom analyze "$AIBOM_SRC" \
              -o cyclonedx -O "$REPORT_DIR/aibom.cdx.json" \
              --llm-model openai/no-llm \
              --llm-provider openai \
              --llm-api-base http://127.0.0.1:9/v1 \
              --llm-api-key no-key \
              --agentic-review-secrets \
              --agentic-max-consecutive-failures 1 \
              --agentic-max-retry-seconds 0 \
              --severity info \
              --compliance all \
              --timing \
              --validate \
              --show-summary 2>&1 | tee "$REPORT_DIR/aibom_console.txt"
          else
            # The "openai/" prefix is stripped by cisco-aibom, so Groq receives GROQ_MODEL as is.
            echo "Groq LLM enrichment with model $GROQ_MODEL"
            timeout 1200 cisco-aibom analyze "$AIBOM_SRC" \
              -o cyclonedx -O "$REPORT_DIR/aibom.cdx.json" \
              --llm-model "openai/$GROQ_MODEL" \
              --llm-provider openai \
              --llm-api-key "$GROQ_API_KEY" \
              --llm-api-base "$AIBOM_LLM_API_BASE" \
              --agentic-fast-model "openai/$GROQ_MODEL" \
              --agentic-review-secrets \
              --severity info \
              --agentic-batch-size 3 \
              --agentic-concurrency 1 \
              --agentic-timeout 120 \
              --compliance all \
              --timing \
              --validate \
              --show-summary 2>&1 | tee "$REPORT_DIR/aibom_console.txt"
          fi
          echo "AIBOM_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Scan agent skills (skill-scanner)
        run: |
          set +e
          skill-scanner scan-all "$SCAN_DIR" --recursive --lenient --format json --output-json "$REPORT_DIR/skills.json"
          echo "SKILLS_STATUS=$?" >> "$GITHUB_ENV"

      - name: Scan MCP servers (mcp-scanner)
        run: |
          set +e
          # mcp-scanner from its isolated pipx environment.
          VENVS=$(pipx environment --value PIPX_LOCAL_VENVS 2>/dev/null)
          MCP_BIN="$VENVS/cisco-ai-mcp-scanner/bin/mcp-scanner"
          [ -x "$MCP_BIN" ] || MCP_BIN=mcp-scanner
          # First MCP config found anywhere under the scan dir.
          MCP_CFG=""
          for n in mcp.json .mcp.json mcp_config.json claude_desktop_config.json cline_mcp_settings.json; do
            MCP_CFG=$(find "$SCAN_DIR" -type f -name "$n" -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | head -n1)
            [ -n "$MCP_CFG" ] && break
          done
          if [ -n "$MCP_CFG" ]; then
            echo "Scanning MCP config: $MCP_CFG with $MCP_BIN"
            "$MCP_BIN" --analyzers yara --format raw config --config-path "$MCP_CFG" > "$REPORT_DIR/mcp.json"
            echo "MCP_STATUS=$?" >> "$GITHUB_ENV"
          else
            echo "No MCP config found under $SCAN_DIR -- skipping mcp-scanner"
            echo "MCP_STATUS=skipped" >> "$GITHUB_ENV"
          fi

      # Rule-based secret scan (values redacted); AI-provider keys are tagged in the report.
      - name: Scan for secrets (gitleaks)
        run: |
          set +e
          if command -v gitleaks >/dev/null; then
            (cd "$SCAN_DIR" && gitleaks dir . --config /tmp/cytex-tools/gitleaks-ai.toml --redact --no-banner \
              --log-level warn --exit-code 0 --max-target-megabytes 5 --report-format json \
              --report-path "$REPORT_DIR/gitleaks.json")
            echo "GITLEAKS_STATUS=$?" >> "$GITHUB_ENV"
          else
            echo "GITLEAKS_STATUS=not_installed" >> "$GITHUB_ENV"
          fi

      # TruffleHog (secrets, detection only: never verifies keys) and ModelScan (unsafe model files).
      - name: Extra detectors (TruffleHog, ModelScan)
        run: bash /tmp/cytex-tools/extra_scans.sh "$SCAN_DIR" "$REPORT_DIR"

      # Merge all scanner outputs into one CycloneDX report; each item tagged with its _source.
      - name: Consolidate scan report
        if: always()
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.inputs.changedFiles }}
        run: |
          mkdir -p "$REPORT_DIR"
          export SCAN_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export SCAN_PREFIX=$(realpath "${SCAN_DIR:-.}")
          export WORKSPACE=$(pwd)
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, "/tmp/cytex-tools")
          report_dir = os.environ["REPORT_DIR"]

          def load(name):
              path = os.path.join(report_dir, name)
              if not os.path.exists(path):
                  return {}
              try:
                  with open(path) as fh:
                      return json.load(fh)
              except (ValueError, OSError):
                  return {}

          sbom = load("sbom.cdx.json")
          aibom = load("aibom.cdx.json")
          grype = load("grype.cdx.json")
          semgrep = load("semgrep.json")

          # No-LLM precision pass: drop data classes reported as agents, non-AI env endpoints
          # and duplicates (each listed in cytexScan.suppressed with a reason), and on
          # incremental scans keep only components in the changed files.
          suppressed = []
          if aibom:
              try:
                  from aibom_refine import refine_aibom
                  changed = None
                  if os.environ.get("SCAN_TYPE") == "incremental":
                      changed = [p for p in os.environ.get("CHANGED_FILES", "").split(",") if p]
                  aibom, suppressed = refine_aibom(aibom, repo_root=os.getcwd(), changed_files=changed)
              except Exception as error:
                  print("AIBOM refine skipped: %s: %s" % (type(error).__name__, error))

          # Make file references repo-relative by stripping absolute runner paths.
          prefixes = sorted(
              {p.rstrip("/") + "/" for p in (os.environ.get("SCAN_PREFIX", ""), os.environ.get("WORKSPACE", ""), os.environ.get("AIBOM_SRC", "")) if p and p != "/"},
              key=len, reverse=True,
          )

          def norm(value):
              if isinstance(value, str):
                  for prefix in prefixes:
                      value = value.replace(prefix, "")
                  return value
              if isinstance(value, list):
                  return [norm(item) for item in value]
              if isinstance(value, dict):
                  return {key: norm(item) for key, item in value.items()}
              return value

          def tools_of(doc):
              tools = (doc.get("metadata") or {}).get("tools")
              if isinstance(tools, dict):
                  return [t for t in tools.get("components") or [] if isinstance(t, dict)]
              if isinstance(tools, list):
                  return [t for t in tools if isinstance(t, dict)]
              return []

          def tag(items, source):
              return [dict(item, _source=source) for item in items]

          combined = dict(aibom) if aibom else {"bomFormat": "CycloneDX", "specVersion": "1.5", "components": [], "metadata": {}}
          tools = tools_of(sbom)
          for extra in tools_of(aibom) + tools_of(grype):
              if extra not in tools:
                  tools.append(extra)
          combined.setdefault("metadata", {})["tools"] = tools
          for key in ("components", "dependencies", "vulnerabilities"):
              merged = tag(sbom.get(key) or [], "sbom") + tag(aibom.get(key) or [], "aibom")
              if key == "vulnerabilities":
                  merged += tag(grype.get(key) or [], "grype")
              if merged:
                  combined[key] = merged

          # CVE enrichment: aibom also nests OSV vulnerabilities under each component; hoist
          # them to top-level vulnerabilities[] (_source "aibom") so they sit beside Grype's.
          for comp in aibom.get("components") or []:
              for cve in comp.get("vulnerabilities") or []:
                  combined.setdefault("vulnerabilities", []).append(dict(cve, _source="aibom"))

          # Skills merge like every other detector: inventory -> components[], findings ->
          # vulnerabilities[], tagged _source "skills". All severities kept.
          skills_doc = load("skills.json")
          skill_results = norm(skills_doc.get("results") or [])
          for result in skill_results:
                name = str(result.get("skill_name") or "") or os.path.basename(str(result.get("skill_path", ""))) or os.environ.get("REPO", "").split("/")[-1]
                ref = "agent-skill-" + name.replace(" ", "-") if name else "agent-skill-root"
                combined.setdefault("components", []).append({
                  "type": "skill",
                  "bom-ref": ref,
                  "name": name,
                  "version": "",
                  "_source": "skills",
                  "properties": [
                      {"name": "skill:Path", "value": str(result.get("skill_path", ""))},
                      {"name": "skill:IsSafe", "value": str(result.get("is_safe", ""))},
                      {"name": "skill:MaxSeverity", "value": str(result.get("max_severity", ""))},
                      {"name": "skill:FindingsCount", "value": str(result.get("findings_count", ""))},
                  ],
                })
                for finding in result.get("findings") or []:
                    combined.setdefault("vulnerabilities", []).append({
                        "bom-ref": str(finding.get("id") or finding.get("rule_id", "SKILL-FINDING")) + "-" + ref,
                        "id": finding.get("rule_id", "SKILL-FINDING"),
                        "source": {"name": "skill-scanner"},
                        "ratings": [{"severity": str(finding.get("severity", "")).lower(), "method": "other"}],
                        "description": "%s: %s Remediation: %s" % (
                            finding.get("title", ""), finding.get("description", ""),
                            finding.get("remediation", "")),
                        "affects": [{"ref": ref}],
                        "properties": [
                            {"name": "skill:Category", "value": str(finding.get("category", ""))},
                            {"name": "skill:Analyzer", "value": str(finding.get("analyzer", ""))},
                            {"name": "skill:File", "value": str(finding.get("file_path", ""))},
                        ],
                        "_source": "skills",
                    })

          # Secrets -> components[] (_source "gitleaks"), values never included.
          try:
              from gitleaks_aibom import gitleaks_components
              leaks = load("gitleaks.json")
              combined.setdefault("components", []).extend(gitleaks_components(leaks if isinstance(leaks, list) else []))
          except Exception as error:
              print("gitleaks merge skipped: %s: %s" % (type(error).__name__, error))

          # MCP findings -> vulnerabilities[] (_source "mcp"). mcp-scanner's raw shape isn't
          # fixed, so locate findings defensively and keep the whole finding in a property.
          mcp_doc = load("mcp.json")
          if isinstance(mcp_doc, list):
              mcp_findings = mcp_doc
          elif isinstance(mcp_doc, dict):
              mcp_findings = (mcp_doc.get("findings") or mcp_doc.get("results")
                              or mcp_doc.get("threats") or mcp_doc.get("vulnerabilities") or [])
          else:
              mcp_findings = []
          for i, f in enumerate(norm(mcp_findings)):
              f = f if isinstance(f, dict) else {"description": str(f)}
              sev = str(f.get("severity") or f.get("level") or "unknown").lower()
              title = str(f.get("threat") or f.get("name") or f.get("title") or "MCP-FINDING")
              combined.setdefault("vulnerabilities", []).append({
                  "bom-ref": "mcp-finding-%d" % i,
                  "id": str(f.get("rule_id") or f.get("id") or title),
                  "source": {"name": "mcp-scanner"},
                  "ratings": [{"severity": sev, "method": "other"}],
                  "description": str(f.get("description") or title),
                  "properties": [{"name": "mcp:Raw", "value": json.dumps(f)[:2000]}],
                  "_source": "mcp",
              })

          # Exact repeats out; a secret found by both cisco-aibom and gitleaks counts once.
          from report_extras import dedupe_exact, dedupe_secrets, strict_bom, validate
          from extra_scanners import merge_extra
          extra_tools, extra_counts = merge_extra(combined, report_dir, semgrep, os.environ.get("SCAN_PREFIX"))
          dedupe_exact(combined)
          secret_count = dedupe_secrets(combined, suppressed, prefixes)

          # Compliance verdicts print to the console, so parse the tables from
          # aibom_console.txt. Rows look like:  eu-1 | Model transparency | pass | detail
          import re as _re
          compliance = {}
          try:
              with open(os.path.join(report_dir, "aibom_console.txt"), encoding="utf-8", errors="replace") as fh:
                  console = fh.read()
          except OSError:
              console = ""
          current = None
          for line in console.splitlines():
              header = _re.search(r"Compliance\s+[—-]\s+([A-Z_]+)", line)
              if header:
                  current = header.group(1)
                  compliance[current] = []
                  continue
              if current:
                  row = _re.search(r"\b([a-z]+-\d+)\b.*?\b(pass|fail|not_applicable)\b", line)
                  if row:
                      compliance[current].append({"id": row.group(1), "status": row.group(2)})
          compliance = {k: v for k, v in compliance.items() if v}

          findings = semgrep.get("results") or []
          severity_counts = {}
          for vuln in combined.get("vulnerabilities") or []:
              ratings = vuln.get("ratings") or [{}]
              severity = str(ratings[0].get("severity", "unknown")).lower()
              severity_counts[severity] = severity_counts.get(severity, 0) + 1
          sast_counts = {}
          for finding in findings:
              severity = str((finding.get("extra") or {}).get("severity", "unknown")).lower()
              sast_counts[severity] = sast_counts.get(severity, 0) + 1

          combined["semgrep"] = {"results": findings, "severityCounts": sast_counts}
          combined["compliance"] = compliance
          combined["cytexScan"] = {
              "scanType": os.environ.get("SCAN_TYPE", "full"),
              "repository": os.environ.get("REPO", ""),
              "branch": os.environ.get("BRANCH", ""),
              "commitSha": os.environ.get("COMMIT_SHA", ""),
              "runId": os.environ.get("RUN_ID", ""),
              "runAttempt": os.environ.get("RUN_ATTEMPT", ""),
              "trigger": os.environ.get("EVENT_NAME", ""),
              "timestampUtc": os.environ.get("SCAN_TIMESTAMP", ""),
              "changedFileCount": int(os.environ.get("CHANGED_FILE_COUNT", "0") or 0),
              "toolStatus": {
                  "syft": os.environ.get("SYFT_STATUS", ""),
                  "grype": os.environ.get("GRYPE_STATUS", ""),
                  "semgrep": os.environ.get("SEMGREP_STATUS", ""),
                  "aibom": os.environ.get("AIBOM_STATUS", ""),
                  "skills": os.environ.get("SKILLS_STATUS", ""),
                  "mcp": os.environ.get("MCP_STATUS", ""),
                  "gitleaks": os.environ.get("GITLEAKS_STATUS", ""),
              },
              "suppressed": suppressed,
              "summary": {
                  "components": len(combined.get("components") or []),
                  "skillComponents": len([c for c in combined.get("components") or []
                                          if isinstance(c, dict) and c.get("_source") == "skills"]),
                  "skillFindings": len([v for v in combined.get("vulnerabilities") or []
                                        if isinstance(v, dict) and v.get("_source") == "skills"]),
                  "mcpFindings": len([v for v in combined.get("vulnerabilities") or []
                                      if isinstance(v, dict) and v.get("_source") == "mcp"]),
                  "secrets": secret_count,
                  "suppressedComponents": len(suppressed),
                  "dependencies": len(combined.get("dependencies") or []),
                  "vulnerabilities": len(combined.get("vulnerabilities") or []),
                  "sastFindings": len(findings),
                  "complianceFrameworks": len(compliance),
                  "complianceFailures": sum(1 for rows in compliance.values()
                                            for row in rows if row.get("status") == "fail"),
                  "severityCounts": severity_counts,
                  "sastSeverityCounts": sast_counts,
              },
              "artifacts": {
                  "report": "cytex-scan-report.json",
                  "sources": ["sbom.cdx.json", "aibom.cdx.json", "aibom_console.txt", "grype.cdx.json",
                              "semgrep.json", "skills.json", "mcp.json", "gitleaks.json"],
              },
          }

          combined = norm(combined)
          # Schema-valid copy for third-party CycloneDX tools; the platform only ingests .json
          # artifacts, so the .cdx extension keeps it out of ingestion.
          combined["cytexScan"]["toolStatus"].update(extra_tools)
          combined["cytexScan"]["summary"].update(extra_counts)
          strict = strict_bom(combined)
          valid, detail = validate(strict)
          combined["cytexScan"]["strictCycloneDX"] = {"valid": valid, "detail": detail,
                                                      "file": "cytex-scan-report.strict.cdx"}
          with open(os.path.join(report_dir, "cytex-scan-report.strict.cdx"), "w") as fh:
              json.dump(strict, fh, indent=2, sort_keys=True)
          with open(os.path.join(report_dir, "cytex-scan-report.json"), "w") as fh:
              json.dump(combined, fh, indent=2, sort_keys=True)
          print("Consolidated report: components=%d vulnerabilities=%d sast=%d" % (
              len(combined.get("components") or []),
              len(combined.get("vulnerabilities") or []),
              len(findings)))
          PYEOF

      # Upload only the consolidated report; intermediate files stay out of the artifact.
      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cytex-scan-report
          path: |
            ${{ env.REPORT_DIR }}/cytex-scan-report.json
            ${{ env.REPORT_DIR }}/cytex-scan-report.strict.cdx
