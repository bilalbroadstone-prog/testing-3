            # =====================================================================================
            - id: cytex-ai.py.llm-output-to-dangerous-sink
              languages: [python]
              severity: ERROR
              message: >-
                LLM output flows into a code-execution, shell, SQL or template sink. A prompt-injected model can run
                arbitrary code or queries. Treat model output as untrusted: parse to a strict schema, allow-list actions,
                and use parameterized queries and sandboxes.
              metadata:
                category: ai-security
                cwe: ["CWE-94: Improper Control of Generation of Code ('Code Injection')", "CWE-78: OS Command Injection", "CWE-89: SQL Injection"]
                owasp-llm: ["LLM05:2025 Improper Output Handling"]
                confidence: HIGH
                likelihood: MEDIUM
                impact: HIGH
              mode: taint
              pattern-sources:
                - pattern-either:
                    - pattern: $C.chat.completions.create(...)
                    - pattern: $C.chat.completions.parse(...)
                    - pattern: $C.completions.create(..., prompt=$P, ...)
                    - pattern: $C.responses.create(...)
                    - pattern: $C.messages.create(..., messages=$M, ...)
                    - pattern: $C.generate_content(...)
                    - pattern: $C.models.generate_content(...)
                    - pattern: $C.converse(..., modelId=$ID, ...)
                    - pattern: $C.invoke_model(..., modelId=$ID, ...)
                    - pattern: ollama.chat(...)
                    - pattern: ollama.generate(...)
                    - pattern: $C.chat(..., model=$MODEL, messages=$MSGS, ...)
                    - pattern: $C.generate(..., model=$MODEL, prompt=$PR, ...)
